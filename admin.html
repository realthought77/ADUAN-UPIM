<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#040A18">
<title>Dashboard Aduan | UIDM</title>
<script>try{var t=localStorage.getItem("uidm-tema");document.documentElement.setAttribute("data-theme",t==="light"?"light":t==="auto"?"auto":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--pg:#02060F;color-scheme:dark}
:root[data-theme="light"]{--pg:#E4EEFF;color-scheme:light}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--pg:#E4EEFF;color-scheme:light}}
body{margin:0;padding:14px;background:var(--pg);font-family:Manrope,system-ui,sans-serif}
.stage{max-width:1180px;margin:0 auto}
dialog{border:0;padding:0;border-radius:18px;max-width:94vw;background:#071A3A}dialog img{display:block;max-width:94vw;max-height:88vh}
dialog::backdrop{background:rgba(2,8,20,.78)}
.dash .item.done{opacity:.5;filter:blur(1.8px) saturate(.6);transition:filter .2s ease,opacity .2s ease}
.dash .item.done:hover,.dash .item.done:focus,.dash .item.done:focus-within,.dash .item.done:active{opacity:1;filter:none}
@media (prefers-reduced-motion:reduce){.dash .item.done{transition:none}}
[hidden]{display:none!important}

.dash{--dbg1:#040A18;--dbg2:#08204A;--dcard:rgba(255,255,255,.055);--dborder:rgba(130,175,255,.22);--dline:rgba(130,175,255,.20);--dtext:#EAF2FF;--dmuted:#93A9CB;--dacc:#3D8BFF;--dacc2:#7CC4FF;--dglow:rgba(61,139,255,.38);--dwtx:#FCD34D;--dotx:#6EE7B7;--dopt:#0B1F3F;--dpill:linear-gradient(135deg,#3D8BFF,#7CC4FF);--dpilltx:#04122B;--derr:#FF9FA0;color-scheme:dark;position:relative;overflow:hidden;border-radius:30px;padding:24px 20px 32px;color:var(--dtext);font-family:Manrope,"Plus Jakarta Sans",system-ui,sans-serif;font-weight:400;font-size:16px;line-height:1.5;text-align:left;
 background:radial-gradient(760px 420px at 88% -8%,var(--dglow),transparent 62%),radial-gradient(620px 460px at -8% 38%,rgba(40,100,230,.28),transparent 62%),linear-gradient(180deg,var(--dbg2),var(--dbg1));border:1px solid var(--dborder)}
:root[data-theme="light"] .dash{--dbg1:#F2F7FF;--dbg2:#D6E6FF;--dcard:rgba(255,255,255,.68);--dborder:rgba(30,90,210,.22);--dline:rgba(30,90,210,.18);--dtext:#0B1F3F;--dmuted:#51658A;--dacc:#1D5FD6;--dacc2:#2F7BFF;--dglow:rgba(47,123,255,.30);--dwtx:#8A5A00;--dotx:#0F6B4A;--dopt:#fff;--dpill:linear-gradient(135deg,#1D5FD6,#3D8BFF);--dpilltx:#fff;--derr:#B3261E;color-scheme:light;}
:root[data-theme="light"] .dash .logos{background:#12355B;padding:10px 18px;border-radius:20px;}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .dash{--dbg1:#F2F7FF;--dbg2:#D6E6FF;--dcard:rgba(255,255,255,.68);--dborder:rgba(30,90,210,.22);--dline:rgba(30,90,210,.18);--dtext:#0B1F3F;--dmuted:#51658A;--dacc:#1D5FD6;--dacc2:#2F7BFF;--dglow:rgba(47,123,255,.30);--dwtx:#8A5A00;--dotx:#0F6B4A;--dopt:#fff;--dpill:linear-gradient(135deg,#1D5FD6,#3D8BFF);--dpilltx:#fff;--derr:#B3261E;color-scheme:light;}:root:not([data-theme="dark"]) .dash .logos{background:#12355B;padding:10px 18px;border-radius:20px;}}
.dash::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;background:linear-gradient(90deg,transparent calc(76% - .5px),var(--dline) 76%,transparent calc(76% + .5px)),linear-gradient(0deg,transparent calc(62% - .5px),var(--dline) 62%,transparent calc(62% + .5px))}
.dash::after{content:"";position:absolute;width:300px;height:300px;left:-120px;top:150px;border-radius:50%;border:1px solid var(--dline);box-shadow:inset 0 0 60px rgba(61,139,255,.12);pointer-events:none}
.dash>*{position:relative;z-index:1}
.dash.wide{width:calc(100% - 32px);max-width:1180px;margin:0 auto 28px}
.dash .nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px 20px}
.dash .logos{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
.dash .logos img{display:block;height:auto}.dash .lg-kpt{width:260px;max-width:100%}.dash .lg-pm{width:170px;max-width:100%}
.dash .navr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dash .d-hero{display:grid;gap:22px;margin:26px 0 8px}
.dash .d-title{font:200 clamp(46px,13vw,96px)/.92 Manrope,system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 14px;background:linear-gradient(180deg,var(--dtext) 8%,var(--dacc2) 64%,var(--dglow));-webkit-background-clip:text;background-clip:text;color:transparent}
.dash .d-sub{max-width:38ch;color:var(--dmuted);margin:0 0 20px;font-size:15px}
.dash .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dash .kpi{padding:16px 16px 14px;border-radius:22px;background:var(--dcard);border:1px solid var(--dborder);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.dash .kl{display:block;font-size:13px;color:var(--dmuted)}
.dash .kpi b{display:block;font:300 clamp(34px,8vw,48px)/1.1 Manrope,system-ui,sans-serif;letter-spacing:-.02em;margin-top:4px}
.dash .kpi .ks{display:block;font-size:12px;color:var(--dmuted);margin-top:2px}
.dash .kpi.ring{display:flex;align-items:center;gap:12px}
.dash .kpi.ring svg{width:70px;height:70px;flex:none;transform:rotate(-90deg)}
.dash .kpi.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.dash .kpi.ring .tr{stroke:var(--dline)}
.dash .kpi.ring #ring{stroke:var(--dacc2);stroke-dasharray:207.35;stroke-dashoffset:207.35;filter:drop-shadow(0 0 5px var(--dacc));transition:stroke-dashoffset .8s ease}
.dash .glass{border-radius:26px;padding:20px 18px;background:var(--dcard);border:1px solid var(--dborder);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-top:16px}
.dash .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dash .gt{font:300 24px/1.2 Manrope,system-ui,sans-serif;letter-spacing:-.01em}
.dash .gt2{font:300 24px/1.2 Manrope,system-ui,sans-serif;margin:28px 0 12px}
.dash #chartM svg{display:block;width:100%;height:auto;max-width:780px;margin:0 auto}
.dash .qs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dash .q{padding:16px;border-radius:22px;background:var(--dcard);border:1px solid var(--dborder);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.dash .q .t{font-weight:600}.dash .q .m{color:var(--dmuted);font-size:13px}
.dash .q b{display:block;font:300 40px/1.1 Manrope,system-ui,sans-serif;color:var(--dtext);margin:6px 0}
.dash .stack{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--dline);margin:10px 0}
.dash select,.dash input[type=search],.dash input[type=date],.dash input[type=text],.dash input[type=email],.dash input[type=password]{font:inherit;font-size:15px;color:var(--dtext);background:var(--dcard);border:1px solid var(--dborder);border-radius:999px;padding:0 16px;min-height:44px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dash option{background:var(--dopt);color:var(--dtext)}
.dash ::placeholder{color:var(--dmuted);opacity:.9}
.dash :focus-visible{outline:2px solid var(--dacc2);outline-offset:2px}
.dash .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.dash .tools #cari{flex:1 1 240px;min-width:0;width:auto;background:var(--dcard);color:var(--dtext);border:1px solid var(--dborder);border-radius:999px;padding:0 16px;min-height:44px}
.dash .filt{align-items:flex-end}
.dash .lb{display:flex;flex-direction:column;gap:4px;margin:0;font-size:12px;font-weight:600;color:var(--dmuted)}
.dash .lb select,.dash .lb input{font-weight:400;width:auto}
.dash .csvrow{display:flex;gap:10px;flex-wrap:wrap;margin:0}
.dash .csv,.dash .pill,.dash .tema,.dash .sec{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:5px 6px 5px 18px;border-radius:999px;border:1px solid var(--dborder);background:var(--dcard);color:var(--dtext);font:600 14px Manrope,system-ui,sans-serif;cursor:pointer;text-decoration:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dash .csv::after,.dash .pill .go{width:34px;height:34px;border-radius:50%;background:#fff;color:#07163A;display:grid;place-items:center;font-size:16px;font-weight:700;flex:none}
.dash .csv::after{content:"\2193"}
.dash .csv#csvY{background:var(--dpill);color:var(--dpilltx);border-color:transparent;box-shadow:0 0 26px var(--dglow)}
.dash .csv.alt{background:var(--dcard);color:var(--dtext);border:1px solid var(--dborder);margin:0}
.dash .csv:hover,.dash .pill:hover,.dash .tema:hover,.dash .sec:hover{filter:brightness(1.12)}
.dash .tema,.dash .sec{padding:5px 16px}
.dash .login{max-width:440px;margin:36px auto 12px;padding:24px 22px}
.dash .login label{display:block;font-weight:600;margin:0 0 6px;font-size:14px}
.dash .login .field{margin-bottom:16px}.dash .login input{width:100%}
.dash .btnp{width:100%;min-height:50px;border:0;border-radius:999px;background:var(--dpill);color:var(--dpilltx);font:700 16px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 0 26px var(--dglow)}
.dash .err{color:var(--derr);font-size:14px;margin-top:8px}
.dash #list{display:grid;grid-template-columns:1fr;gap:12px}
.dash .sep{grid-column:1/-1;margin:10px 0 0;padding-top:14px;border-top:1px solid var(--dline);font-weight:600;font-size:14px;color:var(--dmuted)}
.dash .item{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:14px;margin:0;border-radius:22px;background:var(--dcard);border:1px solid var(--dborder)}
.dash .item img{width:104px;height:104px;object-fit:cover;border-radius:16px;display:block;cursor:zoom-in}
.dash .item>button{padding:0;border:0;background:none;min-height:0;border-radius:16px;display:block;width:104px;height:104px}
.dash .item>div:first-child:empty{width:104px;height:104px;border-radius:16px;border:1px dashed var(--dline)}
.dash .item strong{font-size:17px;font-weight:600;display:inline}
.dash .item .m{color:var(--dmuted);font-size:13px;overflow-wrap:anywhere;margin-top:2px}
.dash .item select{margin-top:10px;min-height:40px;font-size:14px;width:auto}
.dash .badge{display:inline-block;margin-left:8px;padding:2px 12px;border-radius:999px;font:600 12px Manrope,system-ui,sans-serif;border:1px solid transparent;vertical-align:middle;background:none}
.dash .s-Dalam{background:rgba(251,191,36,.14);color:var(--dwtx);border-color:rgba(251,191,36,.45)}
.dash .s-Selesai{background:rgba(52,211,153,.14);color:var(--dotx);border-color:rgba(52,211,153,.45)}
.dash .empty,.dash .m.empty{color:var(--dmuted)}
@media (max-width:520px){.dash .item{grid-template-columns:84px 1fr}.dash .item img,.dash .item>button,.dash .item>div:first-child:empty{width:84px;height:84px}}
@media (min-width:900px){.dash{padding:30px 34px 38px}.dash .d-hero{grid-template-columns:1.1fr 1fr;align-items:end}.dash .qs{grid-template-columns:repeat(4,1fr)}.dash #list{grid-template-columns:repeat(2,1fr)}}

</style>
</head>

        <label class="lb">Dari<input type="date" id="dari"></label>
        <label class="lb">Hingga<input type="date" id="hingga"></label>
        <button type="button" class="csv alt" id="tetap" style="padding-right:18px">Set semula</button>
      </div>
      <div id="list"></div><div class="err" id="pe" role="alert"></div>
    </div>
  </section>
</main>
<dialog id="dlg"><img id="big" alt="Gambar kerosakan"></dialog>
<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $ = id => document.getElementById(id);
const app = initializeApp(window.FIREBASE_CONFIG), auth = getAuth(app), db = getFirestore(app);
let rows = [], unsub = null;
const mk = (t,c,x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

$("login").addEventListener("submit", async e => {
  e.preventDefault(); $("le").textContent = ""; $("go").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch { $("le").textContent = "Emel atau kata laluan tidak betul."; }
  $("go").disabled = false;
});
const BLN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const WARNA = { "Dalam proses": "#F2B705", "Selesai": "#1B6E4A" };
let statRows = [];
const NORM = s => s === "Selesai" ? "Selesai" : "Dalam proses";
const tarikh = r => { const m = r.masa; const d = m && m.toDate ? m.toDate() : (m ? new Date(m) : null); return d && !isNaN(d) ? d : null; };
const tarikhA = r => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(r.tarikhAduan || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : tarikh(r); };
const tkhA = r => { const d = tarikhA(r); return d ? d.toLocaleDateString("ms-MY", { day: "numeric", month: "long", year: "numeric" }) : ""; };
const urut = (x, y) => {
  const sx = NORM(x.status) === "Selesai", sy = NORM(y.status) === "Selesai", k = r => { const a = tarikhA(r), m = tarikh(r); return [a ? a.getTime() : 0, m ? m.getTime() : Date.now()]; };
  if (sx !== sy) return sx ? 1 : -1;                       // yang selesai ke bawah
  const kx = k(x), ky = k(y); return (ky[0] - kx[0]) || (ky[1] - kx[1]);   // paling baharu di atas
};
const padan = (r, q) => { if (!q) return true; const t = [r.nama, r.jabatan, r.jabatanLain, r.jenis, r.jenisLain, r.lokasi, r.catatan, r.rujukan].join(" ").toLowerCase(); return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => t.includes(w)); };
let lastList = [];
const ymd = d => d ? d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") : "";
const lulus = r => {
  const j = $("fJab").value, d1 = $("dari").value, d2 = $("hingga").value, t = ymd(tarikhA(r));
  if (j && r.jabatan !== j) return false;
  if (d1 && (!t || t < d1)) return false;
  if (d2 && (!t || t > d2)) return false;
  return true;
};
function drawStats(){
  const yr = $("yr"), ys = new Set([new Date().getFullYear()]);
  statRows.forEach(r => { const d = tarikhA(r); if (d) ys.add(d.getFullYear()); });
  const years = [...ys].sort((a, b) => b - a);
  const cur = years.includes(+yr.value) ? +yr.value : years[0];
  yr.textContent = ""; years.forEach(y => { const o = mk("option", "", String(y)); o.value = y; yr.append(o); }); yr.value = cur;
  const mon = Array(12).fill(0), q = [0,1,2,3].map(() => ({ n: 0 }));
  statRows.forEach(r => {
    const d = tarikhA(r); if (!d || d.getFullYear() !== cur) return;
    const m = d.getMonth(), st = NORM(r.status); mon[m]++; const Q = q[Math.floor(m / 3)]; Q.n++; Q[st] = (Q[st] || 0) + 1;
  });
  $("csvY").textContent = "Muat turun CSV " + cur; $("tot").textContent = "Tahun " + cur;
  drawChart(mon); drawQuarters(q);
}
function drawChart(mon){
  const NS = "http://www.w3.org/2000/svg", el = (t, a, x) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (x != null) e.textContent = x; return e; };
  const top = Math.ceil(Math.max(4, ...mon) / 4) * 4, L = 30, R = 350, B = 168, H = 130, dx = (R - L - 16) / 11;
  const X = i => L + 8 + i * dx, Y = v => B - H * v / top, cl = y => Math.min(B, Math.max(B - H, y));
  const svg = el("svg", { viewBox: "0 0 360 196", role: "img", "aria-label": "Graf garisan bilangan aduan mengikut bulan" });
  const defs = el("defs"), g = el("linearGradient", { id: "gArea", x1: 0, y1: 0, x2: 0, y2: 1 });
  g.append(el("stop", { offset: "0%", style: "stop-color:var(--dacc);stop-opacity:.45" }), el("stop", { offset: "100%", style: "stop-color:var(--dacc);stop-opacity:0" }));
  defs.append(g); svg.append(defs);
  for (let i = 0; i <= 4; i++) {
    const y = B - H * i / 4;
    svg.append(el("line", { x1: L, x2: R, y1: y, y2: y, style: "stroke:var(--dline)", "stroke-width": 1, "stroke-dasharray": "2 5" }));
    svg.append(el("text", { x: L - 6, y: y + 3.5, "text-anchor": "end", "font-size": 10, style: "fill:var(--dmuted)" }, top * i / 4));
  }
  const P = mon.map((v, i) => [X(i), Y(v)]); let d = "M" + P[0][0] + "," + P[0][1];
  for (let i = 0; i < 11; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    d += " C" + (p1[0] + (p2[0] - p0[0]) / 6) + "," + cl(p1[1] + (p2[1] - p0[1]) / 6) + " " + (p2[0] - (p3[0] - p1[0]) / 6) + "," + cl(p2[1] - (p3[1] - p1[1]) / 6) + " " + p2[0] + "," + p2[1];
  }
  svg.append(el("path", { d: d + " L" + P[11][0] + "," + B + " L" + P[0][0] + "," + B + " Z", fill: "url(#gArea)" }));
  svg.append(el("path", { d, fill: "none", style: "stroke:var(--dacc2);filter:drop-shadow(0 0 5px var(--dacc))", "stroke-width": 2.2, "stroke-linecap": "round" }));
  mon.forEach((n, i) => {
    if (n) {
      svg.append(el("circle", { cx: X(i), cy: Y(n), r: 3.6, style: "fill:var(--dtext);stroke:var(--dacc2)", "stroke-width": 2 }));
      svg.append(el("text", { x: X(i), y: Y(n) - 10, "text-anchor": "middle", "font-size": 10, "font-weight": 700, style: "fill:var(--dtext)" }, n));
    }
    svg.append(el("text", { x: X(i), y: B + 18, "text-anchor": "middle", "font-size": 10, style: "fill:var(--dmuted)" }, BLN[i]));
  });
  $("chartM").textContent = ""; $("chartM").append(svg);
}
function drawQuarters(q){
  const tot = q.reduce((a, b) => a + b.n, 0), box = $("qs"), nama = ["Jan – Mac","Apr – Jun","Jul – Sep","Okt – Dis"];
  box.textContent = "";
  const ss = q.reduce((a, b) => a + (b["Selesai"] || 0), 0), pc = tot ? Math.round(ss * 100 / tot) : 0;
  $("kTot").textContent = tot; $("kProses").textContent = tot - ss; $("kSelesai").textContent = ss; $("kPct").textContent = pc + "%";
  $("ring").style.strokeDashoffset = 207.35 * (1 - pc / 100);
  q.forEach((Q, i) => {
    const c = mk("div", "q");
    c.append(mk("div", "t", "Suku " + (i + 1)), mk("div", "m", nama[i]), mk("b", "", Q.n),
      mk("div", "m", (tot ? Math.round(Q.n * 100 / tot) : 0) + "% daripada jumlah tahun"));
    const bar = mk("div", "stack");
    Object.keys(WARNA).forEach(k => { if (Q[k]) { const s = mk("i"); s.style.width = (Q[k] * 100 / Q.n) + "%"; s.style.background = WARNA[k]; bar.append(s); } });
    c.append(bar, mk("div", "m", "Dalam proses " + (Q["Dalam proses"] || 0) + " | Selesai " + (Q["Selesai"] || 0)));
    box.append(c);
  });
}
$("yr").onchange = drawStats;
async function saveFile(name, blob){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); }

const csvCell = v => { let t = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
function csvFor(list){
  const p = n => String(n).padStart(2, "0");
  const head = ["Rujukan","Tarikh aduan","Masa dihantar","Nama pelapor","Jabatan / Unit","Jenis kerosakan","Butiran Lain-lain","Lokasi","Catatan","Status"];
  const rows = list.map(r => { const d = tarikh(r); return [r.rujukan || r.id || "", (a => a ? a.getFullYear() + "-" + p(a.getMonth() + 1) + "-" + p(a.getDate()) : "")(tarikhA(r)), d ? d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) : "", r.nama, r.jabatan === "Lain-lain" && r.jabatanLain ? r.jabatanLain : (r.jabatan || ""), r.jenis, r.jenisLain, r.lokasi, r.catatan, NORM(r.status)]; });
  return "\ufeff" + [head, ...rows].map(a => a.map(csvCell).join(",")).join("\r\n");
}
async function muatCSV(semua, ditapis){
  const y = +$("yr").value;
  const list = (ditapis ? lastList.slice() : statRows.filter(r => { const d = tarikhA(r); return semua || (d && d.getFullYear() === y); })).sort((a, b) => (tarikhA(a) || 0) - (tarikhA(b) || 0));
  if (!list.length) { alert("Tiada aduan untuk dimuat turun."); return; }
  await saveFile("aduan-uidm-" + (ditapis ? "ditapis" : semua ? "semua-tahun" : y) + ".csv", new Blob([csvFor(list)], { type: "text/csv;charset=utf-8" }));
}
$("csvY").onclick = () => muatCSV(false); $("csvA").onclick = () => muatCSV(true); $("csvF").onclick = () => muatCSV(false, true);

$("out").onclick = () => signOut(auth);
$("flt").onchange = render; $("cari").oninput = render; $("fJab").onchange = render; $("dari").onchange = render; $("hingga").onchange = render;
$("tetap").onclick = () => { $("fJab").value = ""; $("dari").value = ""; $("hingga").value = ""; $("cari").value = ""; $("flt").value = ""; render(); };
$("big").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

onAuthStateChanged(auth, user => {
  $("login").hidden = !!user; $("panel").hidden = !user; $("out").hidden = !user;
  if (unsub) { unsub(); unsub = null; }
  if (!user) { rows = []; return; }
  unsub = onSnapshot(query(collection(db, "aduan"), orderBy("masa", "desc")),
    snap => { rows = snap.docs.map(d => ({ id: d.id, ...d.data() })); $("pe").textContent = ""; render(); },
    () => { $("pe").textContent = "Akaun ini tiada kebenaran melihat aduan. Semak senarai emel admin dalam peraturan Firestore."; });
});

function render(){
  statRows = rows; drawStats();
  const f = $("flt").value, box = $("list"); box.textContent = "";
  const q = $("cari").value.trim(), list = rows.filter(r => (!f || NORM(r.status) === f) && padan(r, q) && lulus(r)).sort(urut);
  lastList = list;
  $("cnt").textContent = list.length;
  if (!list.length) { box.append(mk("p","m",q ? "Tiada aduan yang sepadan." : "Tiada aduan.")); return; }
  let sudah = false;
  list.forEach((r, i) => {
    const el = mk("article","item"), st = NORM(r.status);
    if (st === "Selesai" && $("flt").value !== "Selesai") { el.classList.add("done"); el.tabIndex = 0; }
    if (st === "Selesai" && i > 0 && !sudah) { box.append(mk("div","sep","Aduan selesai (tuding atau ketik untuk melihat butiran)")); } if (st === "Selesai") sudah = true;
    if (typeof r.gambar === "string" && r.gambar.startsWith("data:image/")) {
      const b = mk("button"); b.style.cssText = "padding:0;min-height:0;background:none"; b.setAttribute("aria-label","Besarkan gambar");
      const im = new Image(); im.src = r.gambar; im.alt = "Gambar kerosakan"; b.append(im);
      b.onclick = () => { $("big").src = r.gambar; $("dlg").showModal(); }; el.append(b);
    } else el.append(mk("div"));
    const b = mk("div"), h = mk("div");
    h.append(mk("strong","", r.jenis === "Lain-lain" && r.jenisLain ? r.jenisLain : r.jenis), mk("span","badge s-"+st.split(" ")[0], st));
    b.append(h, mk("div","m",r.lokasi||""), mk("div","m","Pelapor: "+(r.nama||"")+(r.jabatan ? " ("+(r.jabatan === "Lain-lain" && r.jabatanLain ? r.jabatanLain : r.jabatan)+")" : "")));
    if (r.catatan) b.append(mk("div","m",r.catatan));
    const t = r.masa && r.masa.toDate ? r.masa.toDate().toLocaleString("ms-MY") : "";
    b.append(mk("div","m","Tarikh aduan: "+tkhA(r)));
    b.append(mk("div","m",(r.rujukan||r.id)+(t?" | Dihantar "+t:"")));
    const sel = mk("select"); sel.setAttribute("aria-label","Status aduan");
    ["Dalam proses","Selesai"].forEach(o => { const op = mk("option","",o); op.value = o; sel.append(op); });
    sel.value = st;
    sel.onchange = () => {
      const bt = writeBatch(db), lbl = r.jenis === "Lain-lain" && r.jenisLain ? r.jenisLain : r.jenis;
      bt.update(doc(db, "aduan", r.id), { status: sel.value });
      if (r.rujukan) bt.set(doc(db, "status", r.rujukan), { status: sel.value, jenis: lbl || "", kemaskini: serverTimestamp() }, { merge: true });
      bt.commit().catch(() => { $("pe").textContent = "Status tidak dapat dikemas kini."; });
    };
    b.append(sel); el.append(b); box.append(el);
  });
}
</script>
<script>
(function(){
  var R=document.documentElement,B=document.getElementById("tema"),S='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  var ICON={light:S+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',
            dark:S+'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
            auto:S+'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>'};
  var TXT={auto:"Auto",light:"Siang",dark:"Gelap"},m="dark";
  try{m=localStorage.getItem("uidm-tema")||"dark"}catch(e){}
  if(!ICON[m])m="auto";
  function apply(){
    if(m==="auto")R.removeAttribute("data-theme");else R.setAttribute("data-theme",m);
    B.querySelector(".ti").innerHTML=ICON[m];B.querySelector(".tl").textContent=TXT[m];
    B.setAttribute("aria-label","Mod paparan: "+TXT[m]+". Tekan untuk tukar.");
  }
  B.onclick=function(){m={auto:"light",light:"dark",dark:"auto"}[m];try{localStorage.setItem("uidm-tema",m)}catch(e){}apply()};
  apply();
})();
</script>
